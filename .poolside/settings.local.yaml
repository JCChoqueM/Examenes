tools:
    shell:
        allow:
            - find *
            - head *
            - cd *
            - sed *
            - echo *
            - tail *
            - grep *
            - ls *
            - wc *
            - rm *
            - node *
            - cp *
            - git *
            - mkdir *
            - sort
            - printf *
            - "true"
            - command *
            - tree *
